[package]
name = "tsuuchi"
version = "0.1.5"
edition = "2024"
rust-version = "1.89.0"
description = "Tsuuchi (通知) — platform-agnostic notification framework with trait-based backends"
homepage = "https://github.com/pleme-io/tsuuchi"
repository = "https://github.com/pleme-io/tsuuchi"
readme = "README.md"
license = "MIT"
categories = ["os"]
keywords = ["notification", "alert", "toast", "desktop"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# serde_json: the shirase daemon wire is line-delimited JSON (backend_shirase).
serde_json = "1"

# Native macOS notification backend (`backend_macos::UnBackend`). Gated on
# the target so a Linux/CI build of tsuuchi never pulls the objc2 stack;
# no cargo feature is needed because the whole module is cfg'd out.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError", "NSUUID", "NSProcessInfo"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationSound", "UNNotificationTrigger", "UNError", "block2",
] }
block2 = "0.6"

[dev-dependencies]
serde_json = "1"
